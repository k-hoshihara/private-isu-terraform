server {
  listen 80;
  client_max_body_size 10m;
  root /home/isucon/private_isu/webapp/public/;

  location /css/ { expires 1d; }
  location /js/ { expires 1d; }
  location /img/ { expires 1d; }
  location = /favicon.ico { expires 1d; }

  location = /login {
    proxy_set_header Host $host;
    proxy_pass http://light;
  }
  location = /logout {
    proxy_set_header Host $host;
    proxy_pass http://light;
  }
  location = /register {
    proxy_set_header Host $host;
    proxy_pass http://light;
  }

  location /image/ {
    try_files $uri @app;
  }
  location @app {
    proxy_set_header Host $host;
    proxy_pass http://heavy;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache image;
    proxy_cache_valid 200 60s;
    proxy_cache_key "$request_method$host$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_no_cache $cookie_session $http_authorization;
    proxy_cache_bypass $cookie_session $http_authorization;
    add_header X-Cache $upstream_cache_status always;
  }

  location / {
    proxy_set_header Host $host;
    proxy_pass http://heavy;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}

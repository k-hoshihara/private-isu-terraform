server {
  listen 80;
  client_max_body_size 10m;
  root /home/isucon/private_isu/webapp/public/;

  location /css/ { }
  location /js/ { }
  location /img/ { }
  location = /favicon.ico { }

  location = /login {
    proxy_set_header Host $host;
    proxy_pass http://light;
  }
  location = /logout {
    proxy_set_header Host $host;
    proxy_pass http://light;
  }
  location = /register {
    proxy_set_header Host $host;
    proxy_pass http://light;
  }

  location / {
    proxy_set_header Host $host;
    proxy_pass http://heavy;
  }
}

# /etc/nginx/ 直下に置く想定。docs/010_common/0010-setup.md の「ログ」節が同内容を投入する。
# cache は $upstream_cache_status（nginx 自身の判定）を見る。$upstream_http_x_cache
# （上流アプリの応答ヘッダ）では HIT / MISS が数えられない。
log_format ltsv "time:$time_iso8601\t"
                "host:$remote_addr\t"
                "forwardedfor:$http_x_forwarded_for\t"
                "req:$request\t"
                "method:$request_method\t"
                "uri:$request_uri\t"
                "status:$status\t"
                "size:$body_bytes_sent\t"
                "referer:$http_referer\t"
                "ua:$http_user_agent\t"
                "reqtime:$request_time\t"
                "runtime:$upstream_http_x_runtime\t"
                "apptime:$upstream_response_time\t"
                "cache:$upstream_cache_status\t"
                "vhost:$host";
